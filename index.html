<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedNote - Clinical Documentation Hub</title>
    <style>
        :root {
            --bg-color: #f4f6f8;
            --text-color: #1a1a1a;
            --card-bg: #ffffff;
            --border-color: #d1d5db;
            --primary-color: #0d9488;
            --primary-hover: #0f766e;
        }

        [data-theme="dark"] {
            --bg-color: #111827;
            --text-color: #f9fafb;
            --card-bg: #1f2937;
            --border-color: #374151;
            --primary-color: #14b8a6;
            --primary-hover: #2dd4bf;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 16px;
            margin-bottom: 24px;
        }

        h1 { margin: 0; font-size: 1.5rem; }

        .theme-toggle {
            background: var(--primary-color);
            color: #ffffff;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
        }

        .theme-toggle:hover {
            background: var(--primary-hover);
        }

        .section {
            margin-bottom: 24px;
        }

        video {
            width: 100%;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>MedNote Hub</h1>
            <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()">Toggle Dark Mode</button>
        </header>

        <div class="section">
            <h2>System Updates</h2>
            <ul>
                <li>Optimized clinical note parsing and Google ecosystem integration.</li>
                <li>Added native high-contrast dark mode support.</li>
                <li>Integrated video walkthrough and tutorial guide.</li>
            </ul>
        </div>

        <div class="section">
            <h2>Video Tutorial Walkthrough</h2>
            <video controls>
                <source src="mednote-tutorial.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>
        </div>
    </div>

    <script>
        function toggleTheme() {
            const html = document.documentElement;
            const currentTheme = html.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', newTheme);
            localStorage.setItem('mednote_theme', newTheme);
        }

        // Initialize saved theme
        const savedTheme = localStorage.getItem('mednote_theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
    </script>
</body>
</html>
